version: '3.8'

services:
  # MongoDB Database
  mongo:
    image: mongo:latest
    container_name: legalaid-mongo
    ports:
      - "27017:27017" # Host:Container
    volumes:
      - mongo-data:/data/db
    networks:
      - legalaid-network

  # ML Service (Flask)
  ml_service:
    build:
      context: .
      dockerfile: ml_model/Dockerfile
    container_name: legalaid-ml
    ports:
      - "8000:8000"
    environment:
      - ML_PORT=8000
    networks:
      - legalaid-network
    volumes:
      - ./ml_model:/app/ml_model # Hot reload for ML model development

  # ML Service v2 (FT-Transformer)
  ml_service_v2:
    build:
      context: ./ml_model_v2
      dockerfile: Dockerfile
    container_name: legalaid-ml-v2
    ports:
      - "8001:8001"
    networks:
      - legalaid-network
    volumes:
      - ./ml_model_v2:/app # Hot reload for v2 development

  # Backend (Express)
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: legalaid-backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGODB_URI=mongodb://mongo:27017/legalaid
      - ML_SERVICE_URL=http://ml_service_v2:8001/predict_v2
      - MATCHMAKING_MODEL_VERSION=v2
      - NODE_ENV=development
    depends_on:
      - mongo
      - ml_service_v2
    networks:
      - legalaid-network
    volumes:
      - .:/app
      - /app/node_modules

  # Frontend (Next.js)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: legalaid-frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      # In Docker, frontend (server-side) talks to backend container
      - API_URL=http://backend:5000
      # Browser talks to localhost
      - NEXT_PUBLIC_API_URL=http://localhost:5000/api 
    depends_on:
      - backend
    networks:
      - legalaid-network
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next

networks:
  legalaid-network:
    driver: bridge

volumes:
  mongo-data:
